<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseTime Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>

    <main class="app-shell">
      <section class="hero-panel">
        <div class="glass-3d-scene" aria-hidden="true">
          <div class="glass-cube cube-a"></div>
          <div class="glass-cube cube-b"></div>
          <div class="glass-ring"></div>
        </div>

        <div class="topbar">
          <div>
            <p class="eyebrow">Premium Time Tracker</p>
            <h1>PulseTime</h1>
          </div>
          <div class="live-pill" id="livePill">
            <span></span>
            <strong id="statusLabel">Idle</strong>
          </div>
        </div>

        <div class="timer-wrap">
          <p id="currentDate">Today</p>
          <div class="timer" id="timer">00:00:00</div>
          <button class="primary-action" id="sessionButton">Start Work</button>
        </div>
      </section>

      <section class="stats-grid" aria-label="Analytics dashboard">
        <article class="stat-card">
          <span>Today</span>
          <strong id="todayHours">0h 0m</strong>
        </article>
        <article class="stat-card">
          <span>This Week</span>
          <strong id="weekHours">0h 0m</strong>
        </article>
        <article class="stat-card">
          <span>This Month</span>
          <strong id="monthHours">0h 0m</strong>
        </article>
      </section>

      <section class="content-grid">
        <div class="panel log-panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">History</p>
              <h2>Work Log</h2>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Time Range</th>
                  <th>Duration</th>
                  <th>Notes</th>
                </tr>
              </thead>
              <tbody id="logRows"></tbody>
            </table>
            <div class="empty-state" id="emptyState">No sessions yet. Start your first work block.</div>
          </div>
        </div>

        <aside class="panel report-panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">Share</p>
              <h2>WhatsApp Report</h2>
            </div>
            <button class="ghost-button" id="copyReport">Copy</button>
          </div>
          <textarea id="reportText" readonly></textarea>
          <p class="copy-status" id="copyStatus" aria-live="polite"></p>
        </aside>
      </section>
    </main>

    <div class="modal-backdrop" id="noteModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle">Add session notes</h2>
        <p>What did you work on during this session?</p>
        <textarea id="sessionNotes" placeholder="Example: Client dashboard polish, bug fixes, deployment prep"></textarea>
        <div class="modal-actions">
          <button class="ghost-button" id="cancelStop">Cancel</button>
          <button class="primary-action compact" id="saveStop">Save Session</button>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
